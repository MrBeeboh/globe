<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELEMENTS — falling-sand physics sandbox</title>
<style>
  :root {
    --bg: #0c0e12;
    --panel: #14171d;
    --panel2: #1b1f27;
    --line: #2a3040;
    --text: #cdd6e4;
    --dim: #6b7689;
    --accent: #e8a33d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 15px;
    letter-spacing: 3px;
    color: var(--accent);
    font-weight: 600;
  }
  header h1 span { color: var(--dim); font-weight: 400; letter-spacing: 1px; font-size: 11px; margin-left: 8px; }
  .spacer { flex: 1; }
  .ctl {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--dim);
  }
  button {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 5px 12px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.on { background: var(--accent); color: #14171d; border-color: var(--accent); font-weight: 600; }
  input[type=range] { accent-color: var(--accent); width: 110px; }
  main { flex: 1; display: flex; min-height: 0; }
  #palette {
    width: 148px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 10px 8px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .pbtn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 4px;
    border: 1px solid transparent;
    cursor: pointer;
    font-size: 11.5px;
    color: var(--text);
  }
  .pbtn:hover { background: var(--panel2); }
  .pbtn.sel { border-color: var(--accent); background: var(--panel2); }
  .pbtn .sw {
    width: 14px; height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
    box-shadow: 0 0 6px rgba(0,0,0,.5) inset;
  }
  .pbtn .key { margin-left: auto; color: var(--dim); font-size: 9.5px; }
  .pgroup { color: var(--dim); font-size: 9.5px; letter-spacing: 2px; margin: 8px 4px 2px; }
  #stage {
    flex: 1;
    position: relative;
    background: #07080b;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
  }
  canvas { image-rendering: pixelated; cursor: crosshair; }
  #hud {
    position: absolute;
    left: 10px; bottom: 8px;
    font-size: 10.5px;
    color: var(--dim);
    pointer-events: none;
    text-shadow: 0 1px 2px #000;
  }
  #hint {
    position: absolute;
    right: 10px; bottom: 8px;
    font-size: 10.5px;
    color: var(--dim);
    pointer-events: none;
    text-shadow: 0 1px 2px #000;
  }
</style>
</head>
<body>
<header>
  <h1>ELEMENTS<span>falling-sand physics sandbox</span></h1>
  <div class="ctl">brush <input id="brush" type="range" min="1" max="24" value="6"> <span id="brushv">6</span></div>
  <div class="spacer"></div>
  <button id="rainBtn">rain: off</button>
  <button id="pauseBtn">pause</button>
  <button id="stepBtn">step</button>
  <button id="clearBtn">clear</button>
  <div class="ctl" id="fps">-- fps</div>
</header>
<main>
  <nav id="palette"></nav>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="hint">draw: left-drag &nbsp;·&nbsp; erase: right-drag &nbsp;·&nbsp; brush: [ ] &nbsp;·&nbsp; pause: space</div>
  </div>
</main>

<script>
"use strict";

// ---------------------------------------------------------------- elements
const E = {
  EMPTY: 0, WALL: 1, STONE: 2, SAND: 3, WATER: 4, OIL: 5, FIRE: 6,
  WOOD: 7, PLANT: 8, LAVA: 9, ACID: 10, GUNPOWDER: 11, STEAM: 12,
  SMOKE: 13, ICE: 14, SEED: 15, EMBER: 16,
};

// [r,g,b] base color + shade variation amount
const COLORS = {
  [E.EMPTY]:     [10, 11, 15, 0],
  [E.WALL]:      [74, 80, 94, 10],
  [E.STONE]:     [110, 112, 120, 18],
  [E.SAND]:      [216, 178, 110, 26],
  [E.WATER]:     [42, 110, 198, 22],
  [E.OIL]:       [96, 78, 48, 14],
  [E.FIRE]:      [255, 130, 36, 60],
  [E.WOOD]:      [122, 84, 50, 16],
  [E.PLANT]:     [62, 158, 70, 28],
  [E.LAVA]:      [222, 86, 26, 40],
  [E.ACID]:      [148, 222, 52, 26],
  [E.GUNPOWDER]: [62, 62, 66, 12],
  [E.STEAM]:     [188, 200, 212, 20],
  [E.SMOKE]:     [58, 58, 62, 14],
  [E.ICE]:       [160, 212, 240, 18],
  [E.SEED]:      [134, 180, 78, 14],
  [E.EMBER]:     [200, 90, 30, 50],
};

const FLAMMABLE = new Set([E.OIL, E.WOOD, E.PLANT, E.GUNPOWDER, E.SEED]);
const SOLID_STATIC = new Set([E.WALL, E.STONE, E.WOOD, E.PLANT, E.ICE]);
const LIQUID = new Set([E.WATER, E.OIL, E.ACID, E.LAVA]);
const GAS = new Set([E.STEAM, E.SMOKE, E.FIRE]);
// density: a falling particle sinks through anything lighter
const DENSITY = {
  [E.EMPTY]: 0, [E.STEAM]: 0.1, [E.SMOKE]: 0.1, [E.FIRE]: 0.2,
  [E.OIL]: 1, [E.WATER]: 2, [E.ACID]: 2, [E.LAVA]: 3,
  [E.SEED]: 4, [E.GUNPOWDER]: 4, [E.SAND]: 5, [E.EMBER]: 4,
};

// ---------------------------------------------------------------- grid
const CELL = 3;                       // screen pixels per cell
let W = 0, H = 0;                     // grid size in cells
let grid, life, shade, moved;         // typed arrays
let img, imgData;                     // render buffers

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const off = document.createElement("canvas");
const octx = off.getContext("2d");

function sizeToStage() {
  const stage = document.getElementById("stage");
  const w = Math.max(320, stage.clientWidth);
  const h = Math.max(240, stage.clientHeight);
  W = Math.floor(w / CELL);
  H = Math.floor(h / CELL);
  cv.width = W * CELL;
  cv.height = H * CELL;
  off.width = W;
  off.height = H;
  grid = new Uint8Array(W * H);
  life = new Uint8Array(W * H);
  shade = new Uint8Array(W * H);
  moved = new Uint8Array(W * H);
  imgData = octx.createImageData(W, H);
  img = imgData.data;
  ctx.imageSmoothingEnabled = false;
  seedScene();
}

const idx = (x, y) => y * W + x;
const inb = (x, y) => x >= 0 && x < W && y >= 0 && y < H;

function set(i, t) {
  grid[i] = t;
  shade[i] = (Math.random() * 255) | 0;
  life[i] = 0;
  if (t === E.FIRE) life[i] = 24 + ((Math.random() * 36) | 0);
  if (t === E.EMBER) life[i] = 80 + ((Math.random() * 120) | 0);
  if (t === E.STEAM) life[i] = 120 + ((Math.random() * 120) | 0);
  if (t === E.SMOKE) life[i] = 60 + ((Math.random() * 90) | 0);
}

function swapCells(a, b) {
  const t = grid[a]; grid[a] = grid[b]; grid[b] = t;
  const l = life[a]; life[a] = life[b]; life[b] = l;
  const s = shade[a]; shade[a] = shade[b]; shade[b] = s;
}

// ---------------------------------------------------------------- physics
function denser(t, other) {
  return (DENSITY[t] ?? 99) > (DENSITY[other] ?? 99);
}

// try to move cell i (at x,y) into target if target is passable & lighter
function tryMove(i, x, y, nx, ny) {
  if (!inb(nx, ny)) return false;
  const j = idx(nx, ny);
  const t = grid[i], o = grid[j];
  if (o === E.EMPTY || ((LIQUID.has(o) || GAS.has(o)) && denser(t, o))) {
    swapCells(i, j);
    moved[j] = 1;
    return true;
  }
  return false;
}

function ignite(x, y) {
  if (!inb(x, y)) return;
  const i = idx(x, y);
  const t = grid[i];
  if (t === E.GUNPOWDER) { explode(x, y, 7); return; }
  if (FLAMMABLE.has(t)) set(i, E.FIRE);
  if (t === E.ICE) set(i, E.WATER);
}

function explode(cx, cy, r) {
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      const d2 = dx * dx + dy * dy;
      if (d2 > r * r) continue;
      const x = cx + dx, y = cy + dy;
      if (!inb(x, y)) continue;
      const i = idx(x, y);
      const t = grid[i];
      if (t === E.WALL) continue;
      if (t === E.GUNPOWDER && d2 > 1) { set(i, E.FIRE); continue; } // chain
      if (d2 < r * r * 0.55) set(i, Math.random() < 0.6 ? E.FIRE : E.EMPTY);
      else if (Math.random() < 0.5) set(i, E.SMOKE);
    }
  }
}

const N4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];

function step() {
  moved.fill(0);
  const ltr = (frame & 1) === 0; // alternate scan direction to avoid bias
  for (let y = H - 1; y >= 0; y--) {
    for (let k = 0; k < W; k++) {
      const x = ltr ? k : W - 1 - k;
      const i = idx(x, y);
      if (moved[i]) continue;
      const t = grid[i];
      if (t === E.EMPTY || t === E.WALL || t === E.STONE || t === E.WOOD) continue;
      updateCell(i, x, y, t);
    }
  }
}

function updateCell(i, x, y, t) {
  const dir = Math.random() < 0.5 ? 1 : -1;
  switch (t) {

    case E.SAND:
    case E.GUNPOWDER:
    case E.SEED: {
      if (tryMove(i, x, y, x, y + 1)) return;
      if (tryMove(i, x, y, x + dir, y + 1)) return;
      if (tryMove(i, x, y, x - dir, y + 1)) return;
      // seed that landed on sand/stone/plant sprouts into a plant
      if (t === E.SEED) {
        const below = inb(x, y + 1) ? grid[idx(x, y + 1)] : E.WALL;
        if ((below === E.SAND || below === E.STONE || below === E.PLANT ||
             below === E.WALL || below === E.WOOD) && Math.random() < 0.02) {
          set(i, E.PLANT);
        }
      }
      return;
    }

    case E.WATER:
    case E.OIL:
    case E.ACID: {
      if (t === E.WATER) {
        // quench fire / lava around, freeze next to ice
        for (const [dx, dy] of N4) {
          const nx = x + dx, ny = y + dy;
          if (!inb(nx, ny)) continue;
          const j = idx(nx, ny), o = grid[j];
          if (o === E.FIRE) { set(j, E.STEAM); }
          else if (o === E.LAVA) { set(j, E.STONE); set(i, E.STEAM); return; }
          else if (o === E.ICE && Math.random() < 0.002) { set(i, E.ICE); return; }
        }
      } else if (t === E.ACID) {
        // dissolve neighbours (not wall/acid), consuming itself sometimes
        for (const [dx, dy] of N4) {
          const nx = x + dx, ny = y + dy;
          if (!inb(nx, ny)) continue;
          const j = idx(nx, ny), o = grid[j];
          if (o !== E.EMPTY && o !== E.WALL && o !== E.ACID && o !== E.FIRE &&
              o !== E.SMOKE && Math.random() < 0.06) {
            set(j, Math.random() < 0.3 ? E.SMOKE : E.EMPTY);
            if (Math.random() < 0.25) { set(i, E.EMPTY); return; }
          }
        }
      }
      if (tryMove(i, x, y, x, y + 1)) return;
      if (tryMove(i, x, y, x + dir, y + 1)) return;
      if (tryMove(i, x, y, x - dir, y + 1)) return;
      // horizontal dispersion
      const run = t === E.OIL ? 2 : 4;
      for (let s = 0; s < run; s++) {
        if (!tryMove(i, x, y, x + dir, y)) break;
        x += dir;
        i = idx(x, y);
        if (inb(x, y + 1) && grid[idx(x, y + 1)] === E.EMPTY) return;
      }
      return;
    }

    case E.LAVA: {
      for (const [dx, dy] of N4) {
        const nx = x + dx, ny = y + dy;
        if (!inb(nx, ny)) continue;
        const o = grid[idx(nx, ny)];
        if (FLAMMABLE.has(o)) ignite(nx, ny);
        else if (o === E.WATER) { set(idx(nx, ny), E.STEAM); set(i, E.STONE); return; }
        else if (o === E.ICE) set(idx(nx, ny), E.WATER);
        else if (o === E.SAND && Math.random() < 0.001) set(idx(nx, ny), E.STONE); // glass-ish
      }
      if (Math.random() < 0.7) return; // viscous: moves slowly
      if (tryMove(i, x, y, x, y + 1)) return;
      if (tryMove(i, x, y, x + dir, y + 1)) return;
      tryMove(i, x, y, x + dir, y);
      return;
    }

    case E.FIRE: {
      let nearFuel = false;
      for (const [dx, dy] of N4) {
        const nx = x + dx, ny = y + dy;
        if (!inb(nx, ny)) continue;
        const o = grid[idx(nx, ny)];
        if (FLAMMABLE.has(o)) {
          nearFuel = true;
          if (Math.random() < (o === E.GUNPOWDER ? 0.9 : o === E.OIL || o === E.PLANT ? 0.35 : 0.06)) ignite(nx, ny);
        } else if (o === E.ICE && Math.random() < 0.2) set(idx(nx, ny), E.WATER);
      }
      // fire clings to fuel while it burns; free-floating fire dies out
      if (nearFuel) { if (life[i] < 20) life[i] = 20; }
      else if (--life[i] === 0) { set(i, Math.random() < 0.3 ? E.SMOKE : E.EMPTY); return; }
      shade[i] = (Math.random() * 255) | 0; // flicker
      if (!nearFuel && Math.random() < 0.6) {
        tryMove(i, x, y, x + (Math.random() < 0.4 ? dir : 0), y - 1);
      }
      return;
    }

    case E.EMBER: {
      for (const [dx, dy] of N4) {
        const nx = x + dx, ny = y + dy;
        if (inb(nx, ny) && FLAMMABLE.has(grid[idx(nx, ny)]) && Math.random() < 0.1) ignite(nx, ny);
      }
      if (--life[i] === 0) { set(i, E.SMOKE); return; }
      shade[i] = (Math.random() * 255) | 0;
      if (tryMove(i, x, y, x, y + 1)) return;
      tryMove(i, x, y, x + dir, y + 1);
      return;
    }

    case E.STEAM:
    case E.SMOKE: {
      if (--life[i] === 0) {
        set(i, t === E.STEAM && Math.random() < 0.35 ? E.WATER : E.EMPTY);
        return;
      }
      if (Math.random() < 0.25) { tryMove(i, x, y, x + dir, y); return; }
      if (tryMove(i, x, y, x, y - 1)) return;
      if (tryMove(i, x, y, x + dir, y - 1)) return;
      tryMove(i, x, y, x + dir, y);
      return;
    }

    case E.PLANT: {
      // grow into adjacent water; creep slowly upward through air
      for (const [dx, dy] of N4) {
        const nx = x + dx, ny = y + dy;
        if (!inb(nx, ny)) continue;
        const j = idx(nx, ny);
        if (grid[j] === E.WATER && Math.random() < 0.05) set(j, E.PLANT);
        else if (grid[j] === E.EMPTY && dy === -1 && Math.random() < 0.0015) set(j, E.PLANT);
      }
      return;
    }

    case E.ICE: {
      // slowly freeze adjacent water
      for (const [dx, dy] of N4) {
        const nx = x + dx, ny = y + dy;
        if (inb(nx, ny) && grid[idx(nx, ny)] === E.WATER && Math.random() < 0.003) {
          set(idx(nx, ny), E.ICE);
        }
      }
      return;
    }
  }
}

// ---------------------------------------------------------------- render
function render() {
  for (let i = 0, p = 0; i < grid.length; i++, p += 4) {
    const c = COLORS[grid[i]];
    const v = ((shade[i] / 255) - 0.5) * c[3];
    img[p]     = c[0] + v;
    img[p + 1] = c[1] + v;
    img[p + 2] = c[2] + v;
    img[p + 3] = 255;
  }
  octx.putImageData(imgData, 0, 0);
  ctx.drawImage(off, 0, 0, cv.width, cv.height);
}

// ---------------------------------------------------------------- painting
let tool = E.SAND;
let brushR = 6;
let painting = 0; // 0 none, 1 draw, 2 erase
let px = -1, py = -1;

function paint(cx, cy, t) {
  const r = brushR;
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy > r * r) continue;
      const x = cx + dx, y = cy + dy;
      if (!inb(x, y)) continue;
      const i = idx(x, y);
      if (t === E.EMPTY) { set(i, E.EMPTY); continue; }
      if (grid[i] !== E.EMPTY) continue;
      // sparse spawn for powders/liquids feels nicer than solid blobs
      const solid = t === E.WALL || t === E.STONE || t === E.WOOD || t === E.ICE || t === E.PLANT;
      if (solid || Math.random() < 0.55) set(i, t);
    }
  }
}

function paintLine(x0, y0, x1, y1, t) {
  const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let s = 0; s <= steps; s++) {
    paint(Math.round(x0 + (x1 - x0) * s / steps),
          Math.round(y0 + (y1 - y0) * s / steps), t);
  }
}

function evtCell(e) {
  const r = cv.getBoundingClientRect();
  return [
    Math.floor((e.clientX - r.left) / r.width * W),
    Math.floor((e.clientY - r.top) / r.height * H),
  ];
}

cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  cv.setPointerCapture(e.pointerId);
  painting = e.button === 2 ? 2 : 1;
  [px, py] = evtCell(e);
  paint(px, py, painting === 2 ? E.EMPTY : tool);
});
cv.addEventListener("pointermove", e => {
  const [x, y] = evtCell(e);
  if (painting) {
    paintLine(px, py, x, y, painting === 2 ? E.EMPTY : tool);
  }
  px = x; py = y;
  hud.textContent = `${x},${y}`;
});
window.addEventListener("pointerup", () => { painting = 0; });
cv.addEventListener("contextmenu", e => e.preventDefault());

// ---------------------------------------------------------------- ui
const PALETTE = [
  ["POWDERS", null],
  ["sand", E.SAND, "1"],
  ["gunpowder", E.GUNPOWDER, "2"],
  ["seed", E.SEED, "3"],
  ["LIQUIDS", null],
  ["water", E.WATER, "4"],
  ["oil", E.OIL, "5"],
  ["acid", E.ACID, "6"],
  ["lava", E.LAVA, "7"],
  ["HEAT", null],
  ["fire", E.FIRE, "8"],
  ["ember", E.EMBER, "9"],
  ["SOLIDS", null],
  ["wall", E.WALL, "0"],
  ["stone", E.STONE, "q"],
  ["wood", E.WOOD, "w"],
  ["plant", E.PLANT, "e"],
  ["ice", E.ICE, "r"],
  ["TOOLS", null],
  ["erase", E.EMPTY, "x"],
];
const keymap = {};
const pal = document.getElementById("palette");
for (const [name, t, key] of PALETTE) {
  if (t === null) {
    const g = document.createElement("div");
    g.className = "pgroup";
    g.textContent = name;
    pal.appendChild(g);
    continue;
  }
  const b = document.createElement("div");
  b.className = "pbtn" + (t === tool ? " sel" : "");
  const c = COLORS[t];
  b.innerHTML = `<span class="sw" style="background:rgb(${c[0]},${c[1]},${c[2]})"></span>${name}<span class="key">${key}</span>`;
  b.onclick = () => selectTool(t);
  b.dataset.t = t;
  pal.appendChild(b);
  keymap[key] = t;
}
function selectTool(t) {
  tool = t;
  document.querySelectorAll(".pbtn").forEach(b => b.classList.toggle("sel", +b.dataset.t === t));
}

const hud = document.getElementById("hud");
const brushEl = document.getElementById("brush");
brushEl.oninput = () => {
  brushR = +brushEl.value;
  document.getElementById("brushv").textContent = brushR;
};

let paused = false, raining = false, frame = 0, doStep = false;
const pauseBtn = document.getElementById("pauseBtn");
pauseBtn.onclick = () => {
  paused = !paused;
  pauseBtn.textContent = paused ? "resume" : "pause";
  pauseBtn.classList.toggle("on", paused);
};
document.getElementById("stepBtn").onclick = () => { doStep = true; };
document.getElementById("clearBtn").onclick = () => { grid.fill(E.EMPTY); };
const rainBtn = document.getElementById("rainBtn");
rainBtn.onclick = () => {
  raining = !raining;
  rainBtn.textContent = `rain: ${raining ? "on" : "off"}`;
  rainBtn.classList.toggle("on", raining);
};

window.addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); pauseBtn.onclick(); }
  else if (e.key === "[") { brushEl.value = Math.max(1, brushR - 1); brushEl.oninput(); }
  else if (e.key === "]") { brushEl.value = Math.min(24, brushR + 1); brushEl.oninput(); }
  else if (keymap[e.key] !== undefined) selectTool(keymap[e.key]);
});

// ---------------------------------------------------------------- scene
function seedScene() {
  // a little terrain so the first thing you see is alive
  const base = Math.floor(H * 0.82);
  for (let x = 0; x < W; x++) {
    const h = base + Math.round(Math.sin(x * 0.05) * 4 + Math.sin(x * 0.013) * 7);
    for (let y = h; y < H; y++) set(idx(x, y), y > h + 6 ? E.STONE : E.SAND);
  }
  // a pond
  const pl = Math.floor(W * 0.30), pr = Math.floor(W * 0.46);
  for (let x = pl; x < pr; x++) {
    for (let y = base - 8; y < base + 4; y++) {
      if (inb(x, y)) set(idx(x, y), E.WATER);
    }
  }
  // a wooden cabin frame
  const cx0 = Math.floor(W * 0.62), cw = 16, ch = 12, cy0 = base - ch;
  for (let x = cx0; x < cx0 + cw; x++) { set(idx(x, cy0), E.WOOD); }
  for (let y = cy0; y < base; y++) { set(idx(cx0, y), E.WOOD); set(idx(cx0 + cw - 1, y), E.WOOD); }
  // some plants by the pond
  for (let k = 0; k < 14; k++) {
    const x = pl - 3 + ((Math.random() * (pr - pl + 6)) | 0);
    if (inb(x, base - 9)) set(idx(x, base - 9), E.SEED);
  }
}

function rain() {
  for (let k = 0; k < Math.max(2, W >> 6); k++) {
    const x = (Math.random() * W) | 0;
    const i = idx(x, 0);
    if (grid[i] === E.EMPTY) set(i, E.WATER);
  }
}

// ---------------------------------------------------------------- loop
let last = performance.now(), acc = 0, fcount = 0, ftime = 0;
const fpsEl = document.getElementById("fps");

function loop(now) {
  requestAnimationFrame(loop);
  const dt = now - last; last = now;
  if (!paused || doStep) {
    frame++;
    if (raining) rain();
    if (painting) paint(px, py, painting === 2 ? E.EMPTY : tool);
    step();
    doStep = false;
  }
  render();
  fcount++; ftime += dt;
  if (ftime >= 500) {
    fpsEl.textContent = `${Math.round(fcount / ftime * 1000)} fps · ${W}×${H}`;
    fcount = 0; ftime = 0;
  }
}

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(sizeToStage, 150);
});

sizeToStage();
requestAnimationFrame(loop);
</script>
</body>

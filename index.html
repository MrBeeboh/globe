<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Real-time 3D globe tracking global conflicts, disasters, and geopolitical events.">
<meta name="theme-color" content="#0c0b09">
<title>Globe — Live Event Monitor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23141210' stroke='%23b58a3a' stroke-width='1.5'/%3E%3Ccircle cx='12' cy='14' r='5' fill='%233d5a38'/%3E%3Ccircle cx='20' cy='12' r='3' fill='%233d5a38'/%3E%3Ccircle cx='18' cy='20' r='4' fill='%233d5a38'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<script src="/static/vendor/topojson-client.min.js"></script>
<script type="importmap">
{ "imports": { "three": "/static/vendor/three.module.js" } }
</script>
</head>
<body>

<div id="scene"></div>

<header id="topbar">
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <ellipse cx="12" cy="12" rx="10" ry="4" fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.5"/>
      <path d="M2 12h20" stroke="currentColor" stroke-width="0.6" opacity="0.4"/>
      <circle cx="9" cy="10" r="3" fill="currentColor" opacity="0.35"/>
      <circle cx="15" cy="14" r="2" fill="currentColor" opacity="0.35"/>
    </svg>
    <div>
      <div id="wordmark">Globe</div>
      <div class="brand-sub">Live Event Monitor</div>
    </div>
  </div>
  <div id="topstats">
    <div class="stat-pill">
      <span class="label">Events</span>
      <b id="stat-count">0</b>
    </div>
    <div class="stat-pill">
      <span class="label">Window</span>
      <b id="stat-window">72h</b>
    </div>
    <div id="conn" class="connecting">
      <span class="dot"></span>
      <span class="conn-label">Connecting…</span>
    </div>
    <div id="clock"></div>
  </div>
</header>

<aside id="feed-panel">
  <div class="panel-head">
    <span class="panel-title">Event Feed</span>
    <span id="feed-count" class="panel-badge">0</span>
  </div>
  <div id="feed-controls">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="search" type="text" placeholder="Search events, places, actors…" spellcheck="false" autocomplete="off">
      <button id="search-clear" class="search-clear" hidden aria-label="Clear search">×</button>
    </div>
    <div class="chip-row" id="cat-chips"></div>
    <div class="select-row">
      <select id="sel-window" title="Time window">
        <option value="6">Last 6 hours</option>
        <option value="24">Last 24 hours</option>
        <option value="72" selected>Last 72 hours</option>
        <option value="168">Last 7 days</option>
      </select>
      <select id="sel-sev" title="Minimum severity">
        <option value="0" selected>All severity</option>
        <option value="0.45">Medium+</option>
        <option value="0.7">High only</option>
      </select>
    </div>
  </div>
  <div id="feed"></div>
  <footer id="ingest-bar">
    <div class="ingest-head">
      <span class="label">Data channels</span>
      <span id="refresh-timer" class="refresh-timer">refresh in 60s</span>
    </div>
    <div id="ingest-channels"></div>
  </footer>
</aside>

<aside id="detail">
  <header>
    <span class="panel-title">Event Detail</span>
    <button id="detail-close" title="Close (Esc)">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </header>
  <div id="detail-body">
    <div id="detail-badges"></div>
    <div id="detail-title"></div>
    <div class="sevbar-wrap">
      <div class="sevbar-labels"><span>Low</span><span id="detail-sev-text">—</span><span>High</span></div>
      <div class="sevbar" id="detail-sev"></div>
    </div>
    <div id="detail-summary"></div>
    <dl class="kv" id="detail-kv"></dl>
    <a id="detail-link" href="#" target="_blank" rel="noopener">
      Read source article
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 12L12 4M7 4h5v5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</aside>

<div id="hud">
  <button id="labels-toggle" class="hud-btn active" title="Toggle map labels">
    <span class="pill-dot"></span> Labels
  </button>
  <div id="legend">
    <div class="legend-title">Severity</div>
    <div class="legend-items">
      <span class="leg-item"><i class="swatch low"></i> Low</span>
      <span class="leg-item"><i class="swatch med"></i> Medium</span>
      <span class="leg-item"><i class="swatch high"></i> High</span>
    </div>
    <div class="legend-hint">Drag to rotate · Scroll to zoom · Click marker for detail</div>
  </div>
</div>

<div id="tooltip">
  <div class="tt-badges"></div>
  <div class="tt-title"></div>
  <div class="tt-meta"></div>
</div>

<div id="loading">
  <div class="loader-ring"></div>
  <div class="loader-text">Initializing globe</div>
  <div class="loader-step" id="loader-step">Loading cartography…</div>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>

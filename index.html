<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>World Event Globe</title>
<style>
  :root {
    --bg: #0a0a14;
    --surface: #111122;
    --surface2: #1a1a30;
    --text: #c8c8d4;
    --text2: #8888a0;
    --accent: #4da6ff;
    --accent2: #ff6644;
    --accent3: #ffaa22;
    --accent4: #44dd88;
    --accent5: #cc66ff;
    --border: #1e1e38;
    --radius: 10px;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    font-family: var(--font);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  #globe-container {
    position: fixed;
    inset: 0;
    z-index: 1;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  #globe-container:active { cursor: grabbing; }
  #globe-container.grabbing { cursor: grabbing; }

  /* Sidebar */
  #sidebar {
    position: fixed;
    right: 0; top: 0; bottom: 0;
    width: 380px;
    z-index: 10;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transform: translateX(0);
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  #sidebar.collapsed { transform: translateX(380px); }
  #sidebar-toggle {
    position: fixed;
    right: 380px; top: 16px;
    z-index: 11;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
  }
  #sidebar.collapsed ~ #sidebar-toggle { right: 16px; }
  #sidebar-toggle:hover { background: var(--surface2); border-color: var(--accent); }

  .sidebar-header {
    padding: 20px 20px 12px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h2 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: #fff;
  }
  .sidebar-header .subtitle {
    font-size: 12px;
    color: var(--text2);
    margin-top: 2px;
  }
  .sidebar-header .version-badge {
    font-size: 10px;
    font-weight: 700;
    background: var(--accent);
    color: #fff;
    padding: 1px 7px;
    border-radius: 10px;
    vertical-align: middle;
    margin-left: 4px;
    letter-spacing: 0.5px;
  }
  .search-wrap {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
  }
  .search-wrap input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
    font-family: var(--font);
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--text2); }

  .filter-bar {
    display: flex;
    gap: 6px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    transition: all 0.2s;
    white-space: nowrap;
    font-family: var(--font);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filter-btn.me-btn { border-color: var(--accent3); }
  .filter-btn.me-btn.active { background: var(--accent3); border-color: var(--accent3); color: #000; }

  .me-zoom-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 2px solid var(--accent3);
    background: transparent;
    color: var(--accent3);
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    transition: all 0.2s;
    font-family: var(--font);
    text-transform: uppercase;
    letter-spacing: 1px;
    width: calc(100% - 40px);
    margin: 8px 20px;
  }
  .me-zoom-btn:hover { background: var(--accent3); color: #000; }

  .refresh-bar {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
  }
  .refresh-label {
    color: var(--text2);
    white-space: nowrap;
  }
  .refresh-select {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 11px;
    cursor: pointer;
    font-family: var(--font);
    outline: none;
  }
  .refresh-select:focus { border-color: var(--accent); }
  .refresh-timer {
    color: var(--accent);
    font-weight: 600;
    margin-left: auto;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .refresh-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
    margin-left: 8px;
  }
  .refresh-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    transform: rotate(180deg);
  }
  .refresh-btn:active {
    transform: rotate(360deg);
  }

  .labels-toggle {
    -webkit-appearance: none;
    appearance: none;
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    transition: all 0.2s;
    font-family: var(--font);
    margin: 0 20px 8px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    line-height: 1;
  }
  .pill-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text2);
    transition: all 0.2s;
    display: inline-block;
  }
  .labels-toggle:hover { border-color: var(--accent); color: var(--text); }
  .labels-toggle.active { background: rgba(77,166,255,0.15); border-color: var(--accent); color: var(--accent); }
  .labels-toggle.active .pill-dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

  .event-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
  }
  .event-list::-webkit-scrollbar { width: 4px; }
  .event-list::-webkit-scrollbar-track { background: transparent; }
  .event-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .event-card {
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid transparent;
    position: relative;
    overflow: hidden;
  }
  .event-card:hover { background: var(--surface2); border-color: var(--border); }
  .event-card.selected { background: var(--surface2); border-color: var(--accent); }
  .event-card .cat-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    position: absolute;
    left: 14px; top: 16px;
  }
  .event-card .event-title {
    font-size: 13px;
    font-weight: 600;
    color: #e0e0f0;
    padding-left: 16px;
    line-height: 1.3;
  }
  .event-card .event-meta {
    font-size: 11px;
    color: var(--text2);
    padding-left: 16px;
    margin-top: 3px;
    display: flex;
    gap: 10px;
  }
  .event-card .card-source {
    color: var(--accent);
    font-weight: 600;
    font-size: 10px;
    text-transform: lowercase;
  }
  .event-card .severity {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 3px;
    letter-spacing: 0.5px;
  }
  .severity.high { background: rgba(255,100,68,0.2); color: var(--accent2); }
  .severity.medium { background: rgba(255,170,34,0.2); color: var(--accent3); }
  .severity.low { background: rgba(68,221,136,0.2); color: var(--accent4); }

  .legend {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--text2);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* Tooltip */
  #tooltip {
    position: fixed;
    pointer-events: none;
    z-index: 20;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 260px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #tooltip.visible { opacity: 1; }
  #tooltip .tt-title { font-weight: 700; color: #fff; margin-bottom: 3px; }
  #tooltip .tt-detail { color: var(--text2); font-size: 11px; }

  /* Event detail popup */
  #event-popup {
    position: fixed;
    z-index: 25;
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 16px 20px;
    max-width: 480px;
    min-width: 280px;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -120%);
    transition: opacity 0.2s;
    box-shadow: 0 12px 48px rgba(0,0,0,0.7), 0 0 0 1px rgba(77,166,255,0.25);
  }
  #event-popup.visible {
    opacity: 1;
    pointer-events: auto;
  }
  #event-popup-close {
    position: absolute;
    right: 8px; top: 6px;
    background: none;
    border: none;
    color: var(--text2);
    font-size: 18px;
    cursor: pointer;
    padding: 2px 6px;
    line-height: 1;
    border-radius: 4px;
    transition: all 0.15s;
  }
  #event-popup-close:hover { color: #fff; background: var(--surface2); }
  #event-popup-title {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
    padding-right: 24px;
    line-height: 1.3;
  }
  #event-popup-meta {
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 8px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  #event-popup-meta .sev-badge {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 3px;
    letter-spacing: 0.5px;
  }
  #event-popup-meta .cat-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 3px;
  }
  #event-popup-desc {
    font-size: 12px;
    color: #b0b8c8;
    line-height: 1.5;
  }
  #event-popup-desc .popup-summary {
    margin: 0 0 8px 0;
  }
  #event-popup-desc .popup-casualties {
    color: #ff7a5c;
    font-weight: 600;
    font-size: 11px;
    margin-bottom: 6px;
  }
  #event-popup-desc .popup-actors {
    color: var(--text2);
    font-size: 11px;
    margin-bottom: 8px;
  }
  #event-popup-desc .popup-link {
    display: inline-block;
    margin-top: 4px;
    padding: 6px 10px;
    background: rgba(77,166,255,0.15);
    border: 1px solid rgba(77,166,255,0.4);
    border-radius: 6px;
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.15s;
  }
  #event-popup-desc .popup-link:hover {
    background: rgba(77,166,255,0.3);
    color: #fff;
  }

  /* OSINT source & confidence bar */
  .popup-osint {
    display: flex;
    gap: 10px;
    padding: 6px 0 8px;
    font-size: 11px;
    align-items: center;
    flex-wrap: wrap;
  }
  .osint-confidence {
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .osint-source {
    color: var(--text2);
    background: var(--surface2);
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
  }
  .osint-freshness {
    color: var(--accent);
    margin-left: auto;
  }

  /* Action buttons row */
  .popup-actions {
    display: flex;
    gap: 8px;
    margin: 10px 0 12px;
    flex-wrap: wrap;
  }
  .popup-action-btn {
    flex: 1;
    min-width: 80px;
    text-align: center;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    color: var(--text);
    background: var(--surface2);
    border: 1px solid var(--border);
    transition: all 0.15s;
    white-space: nowrap;
    letter-spacing: 0.3px;
  }
  .popup-action-btn:hover {
    border-color: var(--accent);
    color: #fff;
    background: rgba(77,166,255,0.15);
  }
  .popup-action-btn.primary {
    background: linear-gradient(135deg, #ff6644, #ff8a5c);
    color: white;
    border-color: transparent;
  }
  .popup-action-btn.primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(255,102,68,0.4);
  }
  .popup-action-btn.video {
    background: rgba(255,0,0,0.15);
    border-color: rgba(255,0,0,0.3);
    color: #ff6666;
  }
  .popup-action-btn.video:hover {
    background: rgba(255,0,0,0.3);
    border-color: #ff4444;
    color: #fff;
  }

  /* Related events section */
  .popup-related {
    margin-top: 6px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .related-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text2);
    margin-bottom: 6px;
  }
  .related-loading, .related-none {
    font-size: 11px;
    color: var(--text2);
    font-style: italic;
  }
  .related-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 12px;
    line-height: 1.3;
  }
  .related-item:hover {
    background: var(--surface2);
  }
  .related-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .related-title {
    flex: 1;
    color: #c8d0e0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .related-sev {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 1px 5px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .related-sev.high { background: rgba(255,100,68,0.2); color: var(--accent2); }
  .related-sev.medium { background: rgba(255,170,34,0.2); color: var(--accent3); }
  .related-sev.low { background: rgba(68,221,136,0.2); color: var(--accent4); }

  /* Loading overlay */
  #loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s;
    pointer-events: none;
  }
  #loading-overlay.hidden {
    opacity: 0;
  }
  .loading-spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loading-text {
    color: var(--text2);
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  .loading-error {
    color: var(--accent2);
    font-size: 12px;
    margin-top: 8px;
    display: none;
  }
  .loading-error.visible {
    display: block;
  }

  /* Info bar bottom */
  #info-bar {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 18px;
    font-size: 11px;
    color: var(--text2);
    display: flex;
    gap: 16px;
    align-items: center;
    backdrop-filter: blur(10px);
  }
  #info-bar span { color: var(--accent); font-weight: 600; }

  @media (max-width: 768px) {
    #sidebar { width: 100%; transform: translateX(100%); }
    #sidebar.open { transform: translateX(0); }
    #sidebar-toggle { right: 16px; }
  }
</style>
</head>
<body>
<div id="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading events...</div>
  <div class="loading-error" id="loading-error">Could not reach event server — showing cached data</div>
</div>
<div id="globe-container"></div>

<div id="sidebar">
  <div class="sidebar-header">
    <h2>🌍 World Events <span class="version-badge">v2</span></h2>
    <div class="subtitle"><span id="freshness-label">Live OSINT event tracker</span> <span id="updated-time"></span></div>
  </div>
  <div class="search-wrap">
    <input type="text" id="search" placeholder="Search countries, cities, events...">
  </div>
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="conflict" style="color:var(--accent2)">Conflict</button>
    <button class="filter-btn" data-filter="diplomatic" style="color:var(--accent)">Diplomatic</button>
    <button class="filter-btn" data-filter="humanitarian" style="color:var(--accent3)">Humanitarian</button>
    <button class="filter-btn" data-filter="political" style="color:var(--accent5)">Political</button>
  </div>
  <button class="me-zoom-btn" id="me-zoom">📍 Zoom: Middle East</button>
  <button class="labels-toggle active" id="labels-toggle"><span class="pill-dot"></span>Labels</button>
  <div class="refresh-bar">
    <div class="refresh-label">🔄 Auto-refresh</div>
    <select id="refresh-interval" class="refresh-select">
      <option value="0">Manual only</option>
      <option value="15">Every 15 min</option>
      <option value="30" selected>Every 30 min</option>
      <option value="60">Every 1 hour</option>
      <option value="120">Every 2 hours</option>
    </select>
    <button class="refresh-btn" id="manual-refresh" title="Refresh now">⟳</button>
    <div class="refresh-timer" id="refresh-timer">Next: --:--</div>
  </div>
  <div class="event-list" id="event-list"></div>
  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:var(--accent2)"></span> Conflict</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--accent)"></span> Diplomatic</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--accent3)"></span> Humanitarian</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--accent5)"></span> Political</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--accent4)"></span> Geological</div>
  </div>
</div>
<button id="sidebar-toggle" title="Toggle sidebar">☰</button>

<div id="tooltip"><div class="tt-title"></div><div class="tt-detail"></div></div>

<div id="event-popup">
  <button id="event-popup-close">&times;</button>
  <div id="event-popup-title"></div>
  <div id="event-popup-meta"></div>
  <div id="event-popup-desc"></div>
</div>

<div id="info-bar">
  <span id="event-count">0</span> events tracked
  &nbsp;·&nbsp; 🖱 Drag to rotate &nbsp;·&nbsp; 🔍 Scroll to zoom
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─────────────────────────────────────
// API CONFIGURATION
// ─────────────────────────────────────
const API_BASE = 'http://localhost:8091';  // FastAPI backend
let events = [];  // Will be populated from API
let apiEventsLoaded = false;

// ─────────────────────────────────────
// FALLBACK STATIC DATA (if API unavailable)
// ─────────────────────────────────────
const fallbackEvents = [

async function loadEventsFromAPI() {
  const overlay = document.getElementById('loading-overlay');
  const errorEl = document.getElementById('loading-error');
  try {
    console.log('[Globe] Fetching events from API:', `${API_BASE}/events?limit=500&since_hours=168`);
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);
    const resp = await fetch(`${API_BASE}/events?limit=500&since_hours=168`, { signal: controller.signal });
    clearTimeout(timeoutId);
    console.log('[Globe] API response status:', resp.status);
    if (!resp.ok) throw new Error(`API ${resp.status}`);
    const data = await resp.json();
    console.log('[Globe] API returned', data.length, 'events');
    events = data.map((e, i) => ({
      id: e.id,
      title: e.title,
      lat: e.lat,
      lng: e.lng,
      cat: e.category,
      sev: e.severity >= 70 ? 'high' : e.severity >= 40 ? 'medium' : 'low',
      region: e.region,
      desc: e.summary || e.title,
      date: e.published_at?.split('T')[0] || '2026-01-01',
      severity: e.severity,
      confidence: e.confidence,
      actors: e.actors,
      casualties: e.casualties,
      tags: e.tags,
      url: e.url,
      country_code: e.country_code
    }));
    apiEventsLoaded = true;
    console.log(`[Globe] Loaded ${events.length} events from API`);
    errorEl.classList.remove('visible');
  } catch (err) {
    console.warn('[Globe] API unavailable, using fallback data:', err.message);
    events = fallbackEvents.map(e => ({ ...e, severity: e.sev === 'high' ? 80 : e.sev === 'medium' ? 50 : 20 }));
    errorEl.classList.add('visible');
    console.log('[Globe] Fallback loaded', events.length, 'events');
  }
  // Initialize UI after events loaded
  initializeEventMarkers();
  renderEventList();
  updateInfoBar();
  document.getElementById('updated-time').textContent = `• ${new Date().toLocaleTimeString()}`;
  // Hide loading overlay with fade
  setTimeout(() => overlay.classList.add('hidden'), 200);
  setTimeout(() => overlay.style.display = 'none', 800);
}

const GLOBE_RADIUS = 1.5;

const countryLabelGroup = new THREE.Group();
const cityLabelGroup = new THREE.Group();

let labelsVisible = true;

function makeLabelSprite(text, fontSize, color, bgColor) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 512;
  canvas.height = 128;
  ctx.font = `${fontSize}px "Segoe UI", system-ui, -apple-system, sans-serif`;
  const metrics = ctx.measureText(text);
  const tw = metrics.width;
  const th = fontSize * 1.4;
  const padX = fontSize * 0.6;
  const padY = fontSize * 0.3;
  canvas.width = Math.ceil(tw + padX * 2);
  canvas.height = Math.ceil(th + padY * 2);
  ctx.font = `${fontSize}px "Segoe UI", system-ui, -apple-system, sans-serif`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  if (bgColor) {
    ctx.fillStyle = bgColor;
    const bw = tw + padX;
    const bh = th + padY * 0.5;
    ctx.beginPath();
    ctx.roundRect(canvas.width/2 - bw/2, canvas.height/2 - bh/2, bw, bh, 4);
    ctx.fill();
  }
  ctx.fillStyle = color;
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);

  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: true, depthWrite: false });
  const sprite = new THREE.Sprite(material);
  const aspect = canvas.width / canvas.height;
  const height = 0.08;
  sprite.scale.set(height * aspect, height, 1);
  return sprite;
}

function rebuildLabels() {
  // Clear existing labels
  while (countryLabelGroup.children.length > 0) {
    const child = countryLabelGroup.children[0];
    countryLabelGroup.remove(child);
    if (child.material.map) child.material.map.dispose();
    child.material.dispose();
  }

  const dist = camera.position.length();
  const zoomLevel = dist / GLOBE_RADIUS;

  // Determine which countries to show based on zoom
  let countriesToShow = countries.filter(c => c.major);
  if (zoomLevel < 2.0) {
    countriesToShow = countries.filter(c => c.major || !c.minor);
  }
  if (zoomLevel < 1.6) {
    countriesToShow = countries;
  }

  countriesToShow.forEach(c => {
    const isMajor = c.major === true;

// SUN POSITION CALCULATION (real-time)

function getSunDirection() {
  const now = new Date();
  // Use precise UTC time
  const utcHours = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
  const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
  
  // More accurate solar declination (June solstice ~ +23.44°)
  const decl = 23.44 * Math.sin(2 * Math.PI * (dayOfYear - 81) / 365) * Math.PI / 180;
  
  // Hour angle: 15° per hour, 0 at UTC noon, positive west
  // +180° shift to match the globe texture orientation (lng + 180 in latLngToVec3)
  const ha = (utcHours - 12) * 15 * Math.PI / 180 + Math.PI;
  
  // Sun position vector (from Earth center toward sun)
  // Standard geographic convention: X toward 0° lon, Y toward north pole, Z toward 90°E
  // Three.js: Y up, so we map lat/lon accordingly
  const x = Math.cos(decl) * Math.cos(ha);
  const y = Math.sin(decl);
  const z = Math.cos(decl) * Math.sin(ha);
  
  // We want the direction the sun is shining FROM (toward the globe)
  return new THREE.Vector3(-x, -y, -z).normalize();
}

// Default 1x1 textures so GLSL texture2D always has something valid to sample.
function makeSolidTexture(r, g, b) {
  const c = document.createElement('canvas');
  c.width = 1; c.height = 1;
  const cx = c.getContext('2d');
  cx.fillStyle = `rgb(${r},${g},${b})`;
  cx.fillRect(0, 0, 1, 1);
  const t = new THREE.CanvasTexture(c);
  t.needsUpdate = true;
  return t;
}

function loadWithFallback(urls, onLoad) {
  let idx = 0;
  const tryNext = () => {
    if (idx >= urls.length) { console.warn('[Globe] all texture URLs failed for', urls[0]); return; }
    const url = urls[idx++];
    textureLoader.load(
      url,
      (tex) => { tex.colorSpace = THREE.SRGBColorSpace; onLoad(tex); },
      undefined,
      () => { console.warn('[Globe] texture failed, trying fallback:', url); tryNext(); }
    );
  };
  tryNext();
}

// Day/night shader — uses real lighting + terminator, NO null comparisons (invalid GLSL)
const globeMat = new THREE.ShaderMaterial({
  uniforms: {
    uDayTexture:   { value: dayTexture },
    uNightTexture: { value: nightTexture },
    uSunDirection: { value: new THREE.Vector3(1, 0, 0) },
    uCameraPos:    { value: new THREE.Vector3(0, 0, 3.8) },
  },
  vertexShader: /* glsl */`
    varying vec3 vNormal;
    varying vec2 vUv;
    varying vec3 vWorldPos;
    void main() {
      vNormal = normalize(mat3(modelMatrix) * normal);
      vUv = uv;
      vec4 worldPos = modelMatrix * vec4(position, 1.0);
      vWorldPos = worldPos.xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D uDayTexture;
    uniform sampler2D uNightTexture;
    uniform vec3 uSunDirection;
    uniform vec3 uCameraPos;
    varying vec3 vNormal;
    varying vec2 vUv;
    varying vec3 vWorldPos;

    void main() {
      vec3 sunDir = normalize(uSunDirection);
      vec3 N = normalize(vNormal);
      float NdotL = dot(N, sunDir);

      // EXTREMELY OBVIOUS day/night - almost black night, bright day
      vec3 dayColor = texture2D(uDayTexture, vUv).rgb * 1.6;
      vec3 nightColor = texture2D(uNightTexture, vUv).rgb * 0.4;   // very dark night side

      float terminator = smoothstep(-0.01, 0.08, NdotL);
      vec3 color = mix(nightColor, dayColor, terminator);

      // Very strong blue rim on day side
      vec3 viewDir = normalize(uCameraPos - vWorldPos);
      float rim = pow(1.0 - max(dot(N, viewDir), 0.0), 1.4);
      color += vec3(0.3, 0.6, 1.0) * rim * 1.1 * smoothstep(0.0, 0.35, NdotL);

      gl_FragColor = vec4(color, 1.0);
    }
  `
});

  vertexShader: /* glsl */`
    varying vec3 vNormal;
    varying vec3 vPosition;
    void main() {
      vec4 worldPos = modelMatrix * vec4(position, 1.0);
      vNormal = normalize(mat3(modelMatrix) * normal);
      vPosition = worldPos.xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    uniform vec3 uSunDirection;
    uniform vec3 uCameraPos;
    varying vec3 vNormal;
    varying vec3 vPosition;
    void main() {
      vec3 viewDir = normalize(uCameraPos - vPosition);
      vec3 sunDir = normalize(uSunDirection);
      float sunDot = dot(vNormal, sunDir);
      float viewDot = dot(vNormal, viewDir);
      
      // Day side: thin blue limb
      float dayRim = pow(1.0 - max(viewDot, 0.0), 4.0);
      float dayIntensity = smoothstep(-0.1, 0.1, sunDot) * dayRim * 0.25;
      
      // Night side: subtle dark limb
      float nightRim = pow(1.0 - max(viewDot, 0.0), 5.0);
      float nightIntensity = (1.0 - smoothstep(-0.1, 0.1, sunDot)) * nightRim * 0.08;
      
      float intensity = dayIntensity + nightIntensity;
      vec3 color = mix(vec3(0.1, 0.2, 0.4), vec3(0.3, 0.6, 1.0), smoothstep(-0.1, 0.1, sunDot));
      
      gl_FragColor = vec4(color, intensity);
    }
  `,
  uniforms: {
    uSunDirection: { value: new THREE.Vector3(1, 0, 0) },
    uCameraPos: { value: new THREE.Vector3(0, 0, 3.8) }
  },
  transparent: true,

function createEventMarker(event, color) {
  const group = new THREE.Group();
  const severity = event.severity || (event.sev === 'high' ? 80 : event.sev === 'medium' ? 50 : 20);
  const isHigh = severity >= 70;
  const isMed = severity >= 40;
  
  // Base pulse speed by severity
  const baseSpeed = isHigh ? 2.8 : isMed ? 2.0 : 1.4;
  const pulsePhase = Math.random() * Math.PI * 2;
  
  // 1. Outer glow ring (expanding/contracting)
  const outerRingGeom = new THREE.RingGeometry(0.025, 0.035, 32);
  const outerRingMat = new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity: 0,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  const outerRing = new THREE.Mesh(outerRingGeom, outerRingMat);
  group.add(outerRing);
  
  // 2. Middle pulse ring
  const midRingGeom = new THREE.RingGeometry(0.015, 0.022, 32);
  const midRingMat = new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity: 0.7,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  const midRing = new THREE.Mesh(midRingGeom, midRingMat);
  group.add(midRing);
  
  // 3. Core ring (stable, bright)
  const coreRingGeom = new THREE.RingGeometry(0.008, 0.014, 32);
  const coreRingMat = new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity: 1.0,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  const coreRing = new THREE.Mesh(coreRingGeom, coreRingMat);
  group.add(coreRing);
  
  // 4. Central glow sprite (billboard facing camera)
  const glowCanvas = document.createElement('canvas');
  glowCanvas.width = 128;
  glowCanvas.height = 128;
  const gctx = glowCanvas.getContext('2d');
  const grad = gctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, `rgba(${Math.round((color>>16)&255)},${Math.round((color>>8)&255)},${Math.round(color&255)},1)`);
  grad.addColorStop(0.5, `rgba(${Math.round((color>>16)&255)},${Math.round((color>>8)&255)},${Math.round(color&255)},0.3)`);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  gctx.fillStyle = grad;
  gctx.fillRect(0, 0, 128, 128);
  const glowTex = new THREE.CanvasTexture(glowCanvas);
  const glowMat = new THREE.SpriteMaterial({ 
    map: glowTex, 
    transparent: true, 
    opacity: 0.9,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const glowSprite = new THREE.Sprite(glowMat);
  glowSprite.scale.set(0.06, 0.06, 1);
  group.add(glowSprite);
  
  // 5. Particle ring (for high severity)
  let particles = null;
  if (isHigh) {
    const particleCount = 12;
    const particleGeom = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);
    const particlePhase = new Float32Array(particleCount);
    const particleSpeed = new Float32Array(particleCount);
    for (let i = 0; i < particleCount; i++) {
      const angle = (i / particleCount) * Math.PI * 2;
      const radius = 0.018 + Math.random() * 0.01;
      particlePos[i*3] = Math.cos(angle) * radius;
      particlePos[i*3+1] = Math.sin(angle) * radius;
      particlePos[i*3+2] = 0;
      particlePhase[i] = Math.random() * Math.PI * 2;
      particleSpeed[i] = 0.8 + Math.random() * 0.6;
    }
    particleGeom.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
    particleGeom.setAttribute('aPhase', new THREE.BufferAttribute(particlePhase, 1));
    particleGeom.setAttribute('aSpeed', new THREE.BufferAttribute(particleSpeed, 1));
    
    const particleMat = new THREE.PointsMaterial({
      color,
      size: 0.006,
      transparent: true,
      opacity: 0.8,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    particles = new THREE.Points(particleGeom, particleMat);
    group.add(particles);
  }
  
  // 6. Directional indicator (points to event location)
  const indicatorGeom = new THREE.ConeGeometry(0.006, 0.02, 4);
  const indicatorMat = new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity: 0.6,
    depthWrite: false
  });
  const indicator = new THREE.Mesh(indicatorGeom, indicatorMat);
  indicator.rotation.x = -Math.PI / 2;
  indicator.position.z = 0.025;
  group.add(indicator);
  
  const pos = latLngToVec3(event.lat, event.lng, GLOBE_RADIUS * 1.015);
  group.position.copy(pos);
  group.lookAt(new THREE.Vector3(0, 0, 0));
  
  // Store animation data
  group.userData = { 
    type: 'event', 
    ...event, 
    pulsePhase, 
    baseSpeed,
    severity,
    outerRing,
    midRing,
    coreRing,
    glowSprite,
    indicator,
    particles,
    startTime: performance.now()
  };
  
  return group;
}

// LAT/LNG → 3D CONVERSION
// ─────────────────────────────────────
function latLngToVec3(lat, lng, radius = GLOBE_RADIUS) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lng + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.sin(theta)
  );
}

async function loadBorders() {
  try {
    const resp = await fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson');
    if (!resp.ok) throw new Error('fetch failed');
    const geojson = await resp.json();
    const lineMat = new THREE.LineBasicMaterial({ color: 0x335577, transparent: true, opacity: 0.5, depthTest: true });

    geojson.features.forEach(feature => {
      const coords = feature.geometry.coordinates;
      const processRing = (ring) => {
        const pts = ring.map(([lng, lat]) => latLngToVec3(lat, lng, GLOBE_RADIUS * 1.003));
        const geom = new THREE.BufferGeometry().setFromPoints(pts);
        const line = new THREE.Line(geom, lineMat);
        borderGroup.add(line);
      };
      if (feature.geometry.type === 'Polygon') {
        coords.forEach(processRing);
      } else if (feature.geometry.type === 'MultiPolygon') {
        coords.forEach(poly => poly.forEach(processRing));
      }
    });
    updateInfoBar();
  } catch (e) {
    console.log('Border GeoJSON load failed — globe renders without borders', e.message);
  }
}

function timeAgoStr(dateStr) {
  if (!dateStr) return '';
  const then = new Date(dateStr).getTime();
  if (!then) return '';
  const diffSec = Math.floor((Date.now() - then) / 1000);
  if (diffSec < 60) return 'just now';
  if (diffSec < 3600) return `${Math.floor(diffSec / 60)}m ago`;
  if (diffSec < 86400) return `${Math.floor(diffSec / 3600)}h ago`;
  return `${Math.floor(diffSec / 86400)}d ago`;
}

    low: { bg: 'rgba(68,221,136,0.25)', text: 'var(--accent4)' }
  };
  return colors[sev] || colors.medium;
}

function showEventPopup(ev, worldPos) {
  activePopupEvent = ev;
  activePopupWorldPos = worldPos.clone();
  eventPopupTitle.textContent = ev.title;
  const cat = ev.cat || ev.category;
  const severity = ev.severity || (ev.sev === 'high' ? 80 : ev.sev === 'medium' ? 50 : 20);
  const sev = ev.sev || sevLabel(severity);
  const colors = sevColors(sev);
  eventPopupMeta.innerHTML = `
    <span>${ev.region || ev.location_name || ''}</span>
    <span>${ev.date || ev.published_at?.split('T')[0] || ''}</span>
    <span class="sev-badge" style="background:${colors.bg};color:${colors.text}">${sev}</span>
    <span class="cat-badge" style="background:rgba(77,166,255,0.2);color:var(--accent)">${(cat||'').toUpperCase()}</span>
  `;

  // Build the body
  let html = '';

  // Source & confidence bar
  const osintConfidence = ev.confidence || 0;
  const confPct = Math.round(osintConfidence * 100);
  const confColor = osintConfidence >= 0.7 ? 'var(--accent4)' : osintConfidence >= 0.4 ? 'var(--accent3)' : 'var(--accent2)';
  let sourceDomain = '';
  if (ev.url) {
    try { sourceDomain = new URL(ev.url).hostname.replace(/^www\./, ''); } catch (e) {}
  }
  const timeAgo = ev.date ? timeAgoStr(ev.date) : '';
  html += `<div class="popup-osint">
    <span class="osint-confidence" style="color:${confColor}">${confPct}% confidence</span>
    ${sourceDomain ? `<span class="osint-source">${sourceDomain}</span>` : ''}
    ${timeAgo ? `<span class="osint-freshness">${timeAgo}</span>` : ''}
  </div>`;

  // Summary
  const rawSummary = ev.desc || ev.summary || '';
  let cleanSummary = rawSummary.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  if (cleanSummary.length > 320) cleanSummary = cleanSummary.slice(0, 317) + '…';
  if (!cleanSummary) cleanSummary = ev.title;
  html += `<p class="popup-summary">${cleanSummary}</p>`;

  // Casualties
  const cas = ev.casualties;
  if (cas && (cas.killed || cas.wounded || cas.civilian)) {
    const parts = [];
    if (cas.killed) parts.push(`${cas.killed} killed`);
    if (cas.wounded) parts.push(`${cas.wounded} wounded`);
    if (cas.civilian) parts.push(`${cas.civilian} civilian`);
    html += `<div class="popup-casualties">⚠ ${parts.join(' · ')}</div>`;
  }

  // Actors
  if (Array.isArray(ev.actors) && ev.actors.length) {
    const names = ev.actors.map(a => a.full_name || a.name).filter(Boolean).slice(0, 4);
    if (names.length) html += `<div class="popup-actors">Actors: ${names.join(', ')}</div>`;
  }

  // Action buttons row
  const searchQuery = encodeURIComponent(ev.title.replace(/['"]/g, ''));
  let actionsHtml = '<div class="popup-actions">';

  // Article link (if URL exists)
  if (ev.url) {
    let host = '';
    try { host = new URL(ev.url).hostname.replace(/^www\./, ''); } catch (e) { host = 'source'; }
    actionsHtml += `<a class="popup-action-btn primary" href="${ev.url}" target="_blank" rel="noopener noreferrer">📰 Article</a>`;
    actionsHtml += `<a class="popup-action-btn" href="https://news.google.com/search?q=${searchQuery}" target="_blank" rel="noopener">📋 More News</a>`;
  } else {
    actionsHtml += `<a class="popup-action-btn primary" href="https://news.google.com/search?q=${searchQuery}" target="_blank" rel="noopener noreferrer">📋 Find News</a>`;
  }
  actionsHtml += `<a class="popup-action-btn video" href="https://www.youtube.com/results?search_query=${searchQuery}" target="_blank" rel="noopener noreferrer">▶ Video</a>`;
  actionsHtml += '</div>';
  html += actionsHtml;

  // Related events placeholder (filled async)
  html += '<div class="popup-related" id="popup-related"><div class="related-label">Related events</div><div class="related-loading">Loading...</div></div>';

  eventPopupDesc.innerHTML = html;
  eventPopup.classList.add('visible');

  // Project 3D position to screen coordinates ONCE (stable position, doesn't follow rotation)
  const proj = worldPos.clone().project(camera);
  const sx = (proj.x * 0.5 + 0.5) * window.innerWidth;
  const sy = (-proj.y * 0.5 + 0.5) * window.innerHeight;
  popupScreenPos = { x: sx, y: sy, behindCamera: proj.z > 1 };
  applyPopupScreenPosition();

  // Fetch related events asynchronously
  fetchRelatedEvents(ev);
}

function applyPopupScreenPosition() {
  if (!popupScreenPos || popupScreenPos.behindCamera) {
    eventPopup.classList.remove('visible');
    return;
  }
  // Clamp to viewport bounds
  const pw = eventPopup.offsetWidth || 320;
  const ph = eventPopup.offsetHeight || 200;
  const clampedX = Math.max(10, Math.min(window.innerWidth - pw - 10, popupScreenPos.x));
  const clampedY = Math.max(10, Math.min(window.innerHeight - ph - 10, popupScreenPos.y));
  eventPopup.style.left = clampedX + 'px';
  eventPopup.style.top = clampedY + 'px';
  eventPopup.classList.add('visible');
}

async function fetchRelatedEvents(ev) {
  const container = document.getElementById('popup-related');
  if (!container) return;
  try {
    const resp = await fetch(`${API_BASE}/events/${ev.id}/related?limit=4`);
    if (!resp.ok) throw new Error('API error');
    const related = await resp.json();
    if (related.length === 0) {
      container.innerHTML = '<div class="related-label">Related events</div><div class="related-none">None found</div>';
      return;
    }
    let html = '<div class="related-label">Related events</div>';
    related.forEach(r => {
      const rc = catColors[r.category] || 0x888888;
      const rsev = r.severity >= 70 ? 'high' : r.severity >= 40 ? 'medium' : 'low';
      html += `
        <div class="related-item" data-id="${r.id}">
          <span class="related-dot" style="background:#${rc.toString(16).padStart(6,'0')}"></span>
          <span class="related-title">${r.title}</span>
          <span class="related-sev ${rsev}">${rsev}</span>
        </div>`;
    });
    container.innerHTML = html;
    // Click handler for related items
    container.querySelectorAll('.related-item').forEach(item => {
      item.addEventListener('click', () => selectEvent(parseInt(item.dataset.id)));
    });
  } catch (e) {
    if (container) container.innerHTML = '<div class="related-label">Related events</div><div class="related-none">Could not load</div>';
  }
}

function hideEventPopup() {
  eventPopup.classList.remove('visible');

// ─────────────────────────────────────
// EASE FLY CAMERA
// ─────────────────────────────────────
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

// ─────────────────────────────────────
// SIDEBAR EVENT LIST
// ─────────────────────────────────────
const eventList = document.getElementById('event-list');
let activeFilter = 'all';

function renderEventList(filter = 'all', search = '') {
  const filtered = events.filter(e => {
    const cat = e.cat || e.category;
    if (filter !== 'all' && cat !== filter) return false;
    if (search) {
      const q = search.toLowerCase();
      return e.title.toLowerCase().includes(q) || e.region.toLowerCase().includes(q) || (e.desc || e.summary || '').toLowerCase().includes(q);
    }
    return true;
  });

  // Sort by severity desc, then date desc
  filtered.sort((a, b) => (b.severity || 0) - (a.severity || 0));

  // Derive severity label from numeric severity
  function sevLabel(severity) {
    if (severity >= 70) return 'high';
    if (severity >= 40) return 'medium';
    return 'low';
  }

  eventList.innerHTML = filtered.map(e => {
    const cat = e.cat || e.category;
    const severity = e.severity || (e.sev === 'high' ? 80 : e.sev === 'medium' ? 50 : 20);
    const sev = e.sev || sevLabel(severity);
    const color = catColors[cat] || 0x888888;
    // Source domain for card
    let cardSource = '';
    if (e.url) { try { cardSource = new URL(e.url).hostname.replace(/^www\./, '').split('.')[0]; } catch (ex) {} }
    return `
    <div class="event-card" data-event-id="${e.id}">
      <div class="cat-dot" style="background:${'#' + color.toString(16).padStart(6,'0')}"></div>
      <div class="event-title">${e.title}</div>
      <div class="event-meta">
        <span>${e.region}</span>
        <span>${e.date || e.published_at?.split('T')[0] || ''}</span>
        ${cardSource ? `<span class="card-source">${cardSource}</span>` : ''}
        <span class="severity ${sev}">${sev}</span>
      </div>
    </div>
  `;
  }).join('');

  document.getElementById('event-count').textContent = filtered.length;

  // Re-bind click handlers
  eventList.querySelectorAll('.event-card').forEach(card => {
    card.addEventListener('click', () => selectEvent(parseInt(card.dataset.eventId)));
  });
}

// REFRESH TIMER

const refreshSelect = document.getElementById('refresh-interval');
const refreshTimer = document.getElementById('refresh-timer');
let refreshIntervalMinutes = 30;
let nextRefreshTime = Date.now() + refreshIntervalMinutes * 60 * 1000;
let refreshTimerId = null;

function updateRefreshTimer() {
  const remaining = Math.max(0, Math.ceil((nextRefreshTime - Date.now()) / 1000));
  if (remaining <= 0 && refreshIntervalMinutes > 0) {
    refreshTimer.textContent = 'Refreshing...';
    refreshEvents();
    nextRefreshTime = Date.now() + refreshIntervalMinutes * 60 * 1000;
  } else if (refreshIntervalMinutes === 0) {
    refreshTimer.textContent = 'Manual';
  } else {
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    refreshTimer.textContent = `Next: ${m}:${s.toString().padStart(2,'0')}`;
  }
}

async function refreshEvents() {
  // Pulse the refresh timer to show activity
  refreshTimer.style.color = 'var(--accent2)';
  setTimeout(() => { refreshTimer.style.color = 'var(--accent)'; }, 1500);

  // Reload events from API
  await loadEventsFromAPI();

  // Update sidebar freshness
  document.getElementById('updated-time').textContent =
    `• Updated ${new Date().toLocaleTimeString()}`;

  updateInfoBar();
}

  updateRefreshTimer();
});

// ─────────────────────────────────────
// ANIMATION LOOP (fully dynamic)
// ─────────────────────────────────────
const clock = new THREE.Clock();

function animate(time) {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.1);
  const t = time * 0.001;
  controls.update();

  // Scale rotate speed with zoom — precise when close, faster when far
  const dist = camera.position.length();
  controls.rotateSpeed = 0.30 * (dist / GLOBE_RADIUS);
  controls.autoRotateSpeed = 0.20 * (dist / GLOBE_RADIUS);

  // Resume auto-rotate after inactivity (unless manually stopped)
  if (!controls.autoRotate && !flyTarget && !autoRotateManuallyStopped) {
    if (t - lastUserInteraction > AUTO_ROTATE_RESUME_DELAY) {
      controls.autoRotate = true;
    }
  }

  // Fly camera
  if (flyTarget) {
    flyProgress += dt / flyDuration;
    if (flyProgress >= 1) {
      camera.position.copy(flyTarget);
      controls.target.set(0, 0, 0);
      flyTarget = null;
      flyStart = null;
    } else {
      const ease = easeInOutCubic(flyProgress);
      camera.position.lerpVectors(flyStart, flyTarget, ease);
    }
  }

  const newDist = camera.position.length();
  const newZoomLevel = newDist / GLOBE_RADIUS;

  // ─────────────────────────────────────
  // DYNAMIC SUN / DAY-NIGHT CYCLE
  // ─────────────────────────────────────
  const sunDir = getSunDirection();

  // Update globe shader uniforms
  globeMat.uniforms.uSunDirection.value.copy(sunDir);
  globeMat.uniforms.uCameraPos.value.copy(camera.position);

  // Update atmosphere shader
  atmosMat.uniforms.uSunDirection.value.copy(sunDir);
  atmosMat.uniforms.uCameraPos.value.copy(camera.position);

  // Update sun light position (follow real sun)
  sunLight.position.copy(sunDir.clone().multiplyScalar(10));
  sunLight.target.position.set(0, 0, 0);

  // Adjust ambient based on how much of globe is lit (subtle)
  const litFraction = (sunDir.y + 1) * 0.5; // rough approximation
  ambientLight.intensity = 1.2 + litFraction * 0.4;

  // ─────────────────────────────────────
  // SMOOTH ZOOM-AWARE LABEL SCALING
  // ─────────────────────────────────────
  // Zoom in → labels grow, zoom out → labels shrink, continuous per frame
  const labelZoom = Math.max(0.25, Math.min(3.5, newZoomLevel / 1.7));
  countryLabelGroup.children.forEach(sprite => {
    if (!sprite.userData) return;
    const base = sprite.userData.baseHeight || 0.072;
    const aspect = sprite.scale.x / sprite.scale.y || 1;
    sprite.scale.set(base * aspect * labelZoom, base * labelZoom, 1);
    // Fade minor labels smoothly across a wide zoom range
    if (sprite.userData.minor) {
      sprite.material.opacity = newZoomLevel < 1.8 ? 1.0 : Math.max(0, 1.0 - (newZoomLevel - 1.8) * 0.85);
    }
  });
  cityLabelGroup.children.forEach(sprite => {
    const base = sprite.userData?.baseHeight || 0.055;
    const aspect = sprite.scale.x / sprite.scale.y || 1;
    sprite.scale.set(base * aspect * labelZoom * 0.75, base * labelZoom * 0.75, 1);
  });

  // Show/hide country labels by zoom threshold
  const showMinorLabels = newZoomLevel < 3.0;
  countryLabelGroup.children.forEach(sprite => {
    if (sprite.userData && sprite.userData.minor) {
      sprite.visible = showMinorLabels;
    }
  });

  // Fade city labels when zoomed far out
  const cityLabelOpacity = newZoomLevel < 1.8 ? 1.0 : Math.max(0, 1.0 - (newZoomLevel - 1.8) * 0.85);
  cityLabelGroup.children.forEach(sprite => {
    sprite.material.opacity = cityLabelOpacity;
  });

  // Event markers: naturally larger when close, smaller when far
  const markerZoom = Math.max(0.5, Math.min(1.6, 1.8 / newZoomLevel));

  eventGroup.children.forEach(marker => {
    const ud = marker.userData;
    const elapsed = (performance.now() - ud.startTime) * 0.001;
    const phase = ud.pulsePhase;
    const speed = ud.baseSpeed;

    // Outer ring: expanding pulse wave (subtle, zoom-scaled)
    if (ud.outerRing) {
      const outerPhase = (elapsed * speed + phase) % (Math.PI * 2);
      const outerScale = (1 + outerPhase * 0.12) * markerZoom;
      const outerOpacity = (1 - outerPhase / (Math.PI * 2)) * 0.35;
      ud.outerRing.scale.setScalar(outerScale);
      ud.outerRing.material.opacity = outerOpacity;
    }

    // Middle ring: steady pulse
    if (ud.midRing) {
      const midScale = (1 + Math.sin(elapsed * speed * 1.5 + phase) * 0.18) * markerZoom;
      ud.midRing.scale.setScalar(midScale);
      ud.midRing.material.opacity = 0.45 + Math.sin(elapsed * speed * 1.5 + phase) * 0.25;
    }

    // Core ring: subtle breathing
    if (ud.coreRing) {
      ud.coreRing.scale.setScalar((1 + Math.sin(elapsed * speed * 0.8 + phase) * 0.08) * markerZoom);
    }

    // Glow sprite: pulse, zoom-scaled
    if (ud.glowSprite) {
      const glowScale = 0.05 * markerZoom * (1 + Math.sin(elapsed * speed * 2 + phase) * 0.3);
      ud.glowSprite.scale.set(glowScale, glowScale, 1);
      ud.glowSprite.material.opacity = 0.6 + Math.sin(elapsed * speed * 2 + phase) * 0.25;
    }

    // Particles: orbiting for high severity (zoom-scaled radius)
    if (ud.particles && ud.particles.geometry) {
      const positions = ud.particles.geometry.attributes.position.array;
      const phases = ud.particles.geometry.attributes.aPhase.array;
      const speeds = ud.particles.geometry.attributes.aSpeed.array;
      const count = positions.length / 3;
      for (let i = 0; i < count; i++) {
        const angle = elapsed * speeds[i] + phases[i];
        const baseRadius = (0.018 + Math.sin(elapsed * 0.5 + phases[i]) * 0.004) * markerZoom;
        positions[i*3] = Math.cos(angle) * baseRadius;
        positions[i*3+1] = Math.sin(angle) * baseRadius;
        positions[i*3+2] = Math.sin(elapsed * 2 + phases[i]) * 0.003;
      }
      ud.particles.geometry.attributes.position.needsUpdate = true;
      ud.particles.material.opacity = 0.5 + Math.sin(elapsed * speed + phase) * 0.3;
      ud.particles.rotation.z += dt * 0.3;
    }

    // Indicator: slow rotation
    if (ud.indicator) {
      ud.indicator.rotation.z += dt * 0.5;
      ud.indicator.scale.setScalar(markerZoom);
      ud.indicator.material.opacity = 0.4 + Math.sin(elapsed * speed * 0.5 + phase) * 0.2;
    }

    marker.lookAt(new THREE.Vector3(0, 0, 0));
  });

  // ─────────────────────────────────────
  // DYNAMIC BACKGROUND ELEMENTS
  // ─────────────────────────────────────
  // Stars: subtle rotation + twinkle
  stars.rotation.y += dt * 0.008;
  stars.material.opacity = 0.7 + Math.sin(t * 0.2) * 0.15;
  
    // City dots: subtle twinkle
  cityGroup.children.forEach((dot, i) => {
    dot.material.opacity = 0.8 + Math.sin(t * 0.7 + i * 0.1) * 0.2;
    dot.scale.setScalar(1 + Math.sin(t * 1.2 + i * 0.1) * 0.1);
  });

  // ─────────────────────────────────────
  // POSITION EVENT POPUP (using stored screen position, re-project during fly-to)
  // ─────────────────────────────────────
  if (activePopupWorldPos) {
    // Re-project during fly-to animation so popup moves with the globe
    if (flyTarget) {
      const proj = activePopupWorldPos.clone().project(camera);
      const sx = (proj.x * 0.5 + 0.5) * window.innerWidth;
      const sy = (-proj.y * 0.5 + 0.5) * window.innerHeight;
      popupScreenPos = { x: sx, y: sy, behindCamera: proj.z > 1 };
    }
    if (popupScreenPos) {
      applyPopupScreenPosition();
    }
  }

  renderer.render(scene, camera);
}

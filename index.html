<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLOBE — Live Event Monitor</title>
<link rel="stylesheet" href="/static/styles.css">
<script src="/static/vendor/topojson-client.min.js"></script>
<script type="importmap">
{ "imports": { "three": "/static/vendor/three.module.js" } }
</script>
</head>
<body>

<div id="scene"></div>

<header id="topbar">
  <div id="wordmark">GLOBE <span>//</span> LIVE EVENT MONITOR</div>
  <div id="topstats">
    <span class="stat label">events <b id="stat-count">0</b></span>
    <span class="stat label">window <b id="stat-window">72h</b></span>
    <span id="conn" class="connecting"><span class="dot"></span><span class="label">…</span></span>
    <span id="clock"></span>
  </div>
</header>

<aside id="feed-panel">
  <div id="feed-controls">
    <input id="search" type="text" placeholder="search events, places, actors…" spellcheck="false">
    <div class="chip-row" id="cat-chips"></div>
    <div class="select-row">
      <select id="sel-window" title="Time window">
        <option value="6">last 6 h</option>
        <option value="24">last 24 h</option>
        <option value="72" selected>last 72 h</option>
        <option value="168">last 7 d</option>
      </select>
      <select id="sel-sev" title="Minimum severity">
        <option value="0" selected>all severity</option>
        <option value="0.45">sev ≥ 0.45</option>
        <option value="0.7">sev ≥ 0.70</option>
      </select>
    </div>
  </div>
  <div id="feed"></div>
</aside>

<aside id="detail">
  <header>
    <span class="label">event detail</span>
    <button id="detail-close">esc</button>
  </header>
  <div id="detail-body">
    <div id="detail-title"></div>
    <div class="sevbar" id="detail-sev"></div>
    <div id="detail-summary"></div>
    <dl class="kv" id="detail-kv"></dl>
    <a id="detail-link" href="#" target="_blank" rel="noopener">open source article ↗</a>
  </div>
</aside>

<div id="legend">
  <div class="row"><span class="label">severity</span>
    <span class="swatch" style="background:#b58a3a"></span><span class="label">low</span>
    <span class="swatch" style="background:#ffa01e"></span><span class="label">med</span>
    <span class="swatch" style="background:#ff4632"></span><span class="label">high</span>
  </div>
  <div class="src">GDELT · USGS · GDACS · RSS — Natural Earth basemap</div>
</div>

<div id="tooltip"></div>
<div id="loading">INITIALIZING BASEMAP</div>

<script>
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') document.getElementById('detail-close').click();
  });
</script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
